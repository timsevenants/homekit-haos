name: HomeKit Rooms
version: "0.3.0"
slug: homekit_rooms
description: JSON van de HomeKit Rooms-app beheren (sorteren, hernoemen, versies) en kiezen wat de HomeKit Bridge toont
url: https://github.com/timsevenants/homekit-haos
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-group
panel_title: HomeKit Rooms
homeassistant_api: true
map:
  - type: share
    read_only: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API voor agents (alleen met api_token; leeg = uit)
options:
  api_token: ""
schema:
  api_token: password?
